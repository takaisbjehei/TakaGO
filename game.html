<!-- TakaGO Touch & Mobile Controls System -->
<style>
  #taka-mobile-controls {
    display: none;
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (hover: none) and (pointer: coarse), (max-width: 1024px) {
    #taka-mobile-controls {
      display: block;
    }
  }
  .taka-touch-zone {
    pointer-events: auto;
    position: absolute;
  }
  /* Virtual Joystick on the bottom-left */
  #taka-joystick-base {
    bottom: 25px;
    left: 25px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: rgba(15, 23, 42, 0.45);
    border: 2px solid rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #taka-joystick-thumb {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(255, 120, 40, 0.75);
    border: 2px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 0 15px rgba(255, 120, 40, 0.5);
    transform: translate(0px, 0px);
    transition: transform 0.04s ease-out;
  }
  /* Look Swipe Zone (Right half of the screen) */
  #taka-look-zone {
    top: 0;
    right: 0;
    width: 55%;
    height: 68%;
    background: transparent;
  }
  /* Action Buttons Cluster (Bottom Right) */
  .taka-action-btn {
    pointer-events: auto;
    position: absolute;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: #ffffff;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    border: 2px solid rgba(255, 255, 255, 0.35);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: transform 0.08s ease, background 0.12s ease;
  }
  .taka-action-btn:active {
    transform: scale(0.92);
  }
  /* Fire Button */
  #taka-btn-fire {
    bottom: 50px;
    right: 30px;
    width: 82px;
    height: 82px;
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.85), rgba(185, 28, 28, 0.85));
    border-color: rgba(254, 202, 202, 0.7);
    font-size: 15px;
    letter-spacing: 1px;
  }
  /* Scope / Alternate Button */
  #taka-btn-scope {
    bottom: 145px;
    right: 35px;
    width: 62px;
    height: 62px;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.8), rgba(29, 78, 216, 0.8));
    border-color: rgba(191, 219, 254, 0.6);
    font-size: 12px;
  }
  /* Jump Button */
  #taka-btn-jump {
    bottom: 50px;
    right: 125px;
    width: 65px;
    height: 65px;
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.8), rgba(4, 120, 87, 0.8));
    border-color: rgba(167, 243, 208, 0.6);
    font-size: 13px;
  }
  /* Crouch Button (With indicator) */
  #taka-btn-crouch {
    bottom: 125px;
    right: 110px;
    width: 62px;
    height: 62px;
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.8), rgba(180, 83, 9, 0.8));
    border-color: rgba(253, 230, 138, 0.6);
    font-size: 11px;
  }
  #taka-btn-crouch.is-crouched {
    background: linear-gradient(135deg, rgba(234, 88, 12, 0.95), rgba(154, 52, 18, 0.95));
    border-color: #fef08a;
    box-shadow: 0 0 16px rgba(234, 88, 12, 0.8);
  }
  /* Reload Button */
  #taka-btn-reload {
    bottom: 220px;
    right: 38px;
    width: 54px;
    height: 54px;
    background: linear-gradient(135deg, rgba(107, 114, 128, 0.8), rgba(55, 65, 81, 0.8));
    border-color: rgba(229, 231, 235, 0.5);
    font-size: 11px;
  }

  /* Full-bleed mobile auto-fit */
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    margin: 0;
    padding: 0;
    touch-action: none;
    -webkit-overflow-scrolling: touch;
  }
  canvas {
    width: 100vw !important;
    height: 100vh !important;
    object-fit: cover;
  }

  /* Horizontal landscape layout optimization for mobile */
  @media (max-height: 520px) and (orientation: landscape) {
    #taka-joystick-base {
      bottom: 15px;
      left: 20px;
      width: 115px;
      height: 115px;
    }
    #taka-joystick-thumb {
      width: 50px;
      height: 50px;
    }
    #taka-btn-fire {
      bottom: 25px;
      right: 20px;
      width: 68px;
      height: 68px;
      font-size: 13px;
    }
    #taka-btn-scope {
      bottom: 105px;
      right: 25px;
      width: 50px;
      height: 50px;
      font-size: 11px;
    }
    #taka-btn-jump {
      bottom: 25px;
      right: 98px;
      width: 54px;
      height: 54px;
      font-size: 12px;
    }
    #taka-btn-crouch {
      bottom: 90px;
      right: 86px;
      width: 50px;
      height: 50px;
      font-size: 10px;
    }
    #taka-btn-reload {
      bottom: 165px;
      right: 28px;
      width: 44px;
      height: 44px;
      font-size: 10px;
    }
  }

  /* Portrait rotation banner to prompt playing in horizontal */
  @media screen and (orientation: portrait) and (max-width: 900px) {
    #taka-rotate-prompt {
      display: flex !important;
    }
  }
  #taka-rotate-prompt {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: rgba(10, 15, 25, 0.96);
    color: #ffffff;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #taka-rotate-prompt .rotate-icon {
    width: 56px;
    height: 56px;
    margin-bottom: 16px;
    animation: taka-rotate-spin 2s ease-in-out infinite alternate;
  }
  @keyframes taka-rotate-spin {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(-90deg); }
    100% { transform: rotate(-90deg); }
  }
</style>

<div id="taka-rotate-prompt">
  <svg class="rotate-icon" viewBox="0 0 24 24" fill="none" stroke="#ff7828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
    <path d="M12 18h.01"></path>
  </svg>
  <h2 style="margin:0 0 8px;font-size:20px;font-weight:700;">Rotate Device</h2>
  <p style="margin:0;font-size:14px;color:#94a3b8;max-width:280px;">Please rotate your phone to landscape (horizontal) to play TakaGO.</p>
</div>

<div id="taka-mobile-controls">
  <!-- Joystick Base & Thumb -->
  <div id="taka-joystick-base" class="taka-touch-zone">
    <div id="taka-joystick-thumb"></div>
  </div>

  <!-- Touch Look Zone for turning / aiming -->
  <div id="taka-look-zone" class="taka-touch-zone"></div>

  <!-- Virtual Buttons -->
  <button id="taka-btn-fire" class="taka-action-btn" type="button">FIRE</button>
  <button id="taka-btn-scope" class="taka-action-btn" type="button">SCOPE</button>
  <button id="taka-btn-jump" class="taka-action-btn" type="button">JUMP</button>
  <button id="taka-btn-crouch" class="taka-action-btn" type="button">CROUCH</button>
  <button id="taka-btn-reload" class="taka-action-btn" type="button">RELOAD</button>
</div>

<script>
(function() {
  window.__takaMobileMove = { forward: 0, right: 0 };
  window.__takaMobileJump = false;
  window.__takaMobileDuck = false;
  window.__takaMobileWalk = false;

  // 1. Virtual Joystick
  var joyBase = document.getElementById('taka-joystick-base');
  var joyThumb = document.getElementById('taka-joystick-thumb');
  var joyTouchId = null;
  var joyCenter = { x: 0, y: 0 };
  var maxRadius = 50;

  function updateJoystick(clientX, clientY) {
    var dx = clientX - joyCenter.x;
    var dy = clientY - joyCenter.y;
    var dist = Math.hypot(dx, dy);
    var clampedDist = Math.min(dist, maxRadius);
    var angle = Math.atan2(dy, dx);

    var thumbX = Math.cos(angle) * clampedDist;
    var thumbY = Math.sin(angle) * clampedDist;
    joyThumb.style.transform = 'translate(' + thumbX + 'px, ' + thumbY + 'px)';

    var normX = thumbX / maxRadius;
    var normY = thumbY / maxRadius;

    // CS forward is -Y, right is +X
    window.__takaMobileMove.forward = -normY;
    window.__takaMobileMove.right = normX;

    if (window.__takaEnqueue) {
      window.__takaEnqueue('move');
    }
  }

  function resetJoystick() {
    joyTouchId = null;
    joyThumb.style.transform = 'translate(0px, 0px)';
    window.__takaMobileMove.forward = 0;
    window.__takaMobileMove.right = 0;
    if (window.__takaEnqueue) {
      window.__takaEnqueue('move');
    }
  }

  joyBase.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (joyTouchId === null && e.changedTouches.length > 0) {
      var touch = e.changedTouches[0];
      joyTouchId = touch.identifier;
      var rect = joyBase.getBoundingClientRect();
      joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      updateJoystick(touch.clientX, touch.clientY);
    }
  }, { passive: false });

  window.addEventListener('touchmove', function(e) {
    if (joyTouchId !== null) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          updateJoystick(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
          break;
        }
      }
    }
  }, { passive: false });

  window.addEventListener('touchend', function(e) {
    if (joyTouchId !== null) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          resetJoystick();
          break;
        }
      }
    }
  });

  window.addEventListener('touchcancel', function(e) {
    if (joyTouchId !== null) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          resetJoystick();
          break;
        }
      }
    }
  });

  // 2. Touch Look / Aim Zone
  var lookZone = document.getElementById('taka-look-zone');
  var lookTouchId = null;
  var lastLookPos = { x: 0, y: 0 };

  lookZone.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (lookTouchId === null && e.changedTouches.length > 0) {
      var touch = e.changedTouches[0];
      lookTouchId = touch.identifier;
      lastLookPos = { x: touch.clientX, y: touch.clientY };
    }
  }, { passive: false });

  window.addEventListener('touchmove', function(e) {
    if (lookTouchId !== null) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        var touch = e.changedTouches[i];
        if (touch.identifier === lookTouchId) {
          var dx = touch.clientX - lastLookPos.x;
          var dy = touch.clientY - lastLookPos.y;
          lastLookPos = { x: touch.clientX, y: touch.clientY };
          if (window.__takaLook) {
            // Scale touch sensitivity smoothly
            window.__takaLook(dx * 1.6, dy * 1.6);
          }
          break;
        }
      }
    }
  }, { passive: false });

  window.addEventListener('touchend', function(e) {
    if (lookTouchId !== null) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === lookTouchId) {
          lookTouchId = null;
          break;
        }
      }
    }
  });

  window.addEventListener('touchcancel', function(e) {
    if (lookTouchId !== null) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === lookTouchId) {
          lookTouchId = null;
          break;
        }
      }
    }
  });

  // 3. Virtual Action Buttons
  var btnFire = document.getElementById('taka-btn-fire');
  var btnScope = document.getElementById('taka-btn-scope');
  var btnJump = document.getElementById('taka-btn-jump');
  var btnCrouch = document.getElementById('taka-btn-crouch');
  var btnReload = document.getElementById('taka-btn-reload');

  btnFire.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (window.__takaEnqueue) window.__takaEnqueue('fireDown');
  }, { passive: false });

  btnFire.addEventListener('touchend', function(e) {
    e.preventDefault();
    if (window.__takaEnqueue) window.__takaEnqueue('fireUp');
  }, { passive: false });

  btnScope.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (window.__takaEnqueue) window.__takaEnqueue('alternate');
  }, { passive: false });

  btnJump.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (window.__takaEnqueue) window.__takaEnqueue('jump');
  }, { passive: false });

  btnCrouch.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (window.__takaEnqueue) {
      window.__takaEnqueue('duck');
      btnCrouch.classList.toggle('is-crouched', window.__takaMobileDuck);
    }
  }, { passive: false });

  btnReload.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (window.__takaEnqueue) window.__takaEnqueue('reload');
  }, { passive: false });

})();
</script>
</body></html>
